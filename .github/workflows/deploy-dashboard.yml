name: Build and deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  pull_request:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build dashboard
        run: npm run build
      - name: Test recurrence and integrations
        run: npm test
      - name: Test local Worker API
        run: |
          node -e 'const fs=require("node:fs"),c=require("node:crypto"); fs.writeFileSync(".dev.vars", `ADMIN_PASSWORD="ci-local-only"\nTOKEN_ENCRYPTION_KEY="${c.randomBytes(32).toString("base64")}"\n`);'
          npm run db:local
          npm run dev:api > /tmp/household-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; rm -f .dev.vars' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/auth/session > /dev/null; then break; fi
            sleep 1
          done
          npm run test:integration
      - name: Validate deployment package
        run: npx --no-install wrangler deploy --dry-run
      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets.'
            exit 1
          fi
          node scripts/configure-deployment.mjs
          npx --no-install wrangler d1 migrations apply household --remote --config wrangler.deploy.json
          npx --no-install wrangler deploy --config wrangler.deploy.json
